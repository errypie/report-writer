<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pentest Reports{% endblock %} · {{ BRAND }}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">
      <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="28" height="28">
      <span class="brand-name">{{ BRAND }}</span>
      <span class="brand-sep"></span>
      <span class="brand-app">Pentest Reports</span>
    </a>
    <div class="topbar-center">{% block topbar_center %}{% endblock %}</div>
    <div class="topbar-actions">
      {% block topbar_actions %}{% endblock %}
      <a class="btn btn-ghost nav-lib" href="{{ url_for('request_template_page') }}" title="Шаблон заявки на пентест для команд">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 3h-4.18A3 3 0 0 0 12 1a3 3 0 0 0-2.82 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <span>Заявка</span>
      </a>
      <a class="btn btn-ghost nav-lib" href="{{ url_for('library_page') }}" title="Библиотека уязвимостей">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M4 6H2v14a2 2 0 0 0 2 2h14v-2H4V6zm16-4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
        <span>Библиотека</span>
      </a>
      <button class="icon-btn" id="theme-toggle" title="Light / dark theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8A9 9 0 0 0 12 3z"/></svg>
      </button>
    </div>
  </header>
  {% block content %}{% endblock %}
  <script>
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var root = document.documentElement;
      var dark = root.dataset.theme ? root.dataset.theme === 'dark'
                                    : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
