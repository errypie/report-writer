<article class="finding sevborder-{{ f.severity }}" id="finding-{{ f.id }}" data-scope="finding" data-id="{{ f.id }}">
  <header class="finding-head">
    <span class="finding-code">{{ f.code or 'F-??' }}</span>
    <input class="finding-title" data-field="title" value="{{ f.title }}" placeholder="{{ L.name }}">
    <button class="btn btn-sm btn-ghost finding-to-lib" title="Сохранить описание в библиотеку уязвимостей">
      <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2z"/></svg>
      В библиотеку
    </button>
    <button class="icon-btn finding-collapse" title="Свернуть / развернуть" aria-label="Collapse">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg>
    </button>
    <button class="icon-btn danger finding-delete" title="Удалить уязвимость" aria-label="Delete finding">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
  </header>
  <div class="finding-body">
    <div class="meta-grid">
      <label><span>{{ L.level }}</span>
        <select data-field="severity" class="sev-select sev-{{ f.severity }}">
          {% for s in SEVERITIES %}<option value="{{ s }}" {% if f.severity == s %}selected{% endif %}>{{ L.severity[s] }}</option>{% endfor %}
        </select>
      </label>
      <label class="span-2"><span>{{ L.cvss }}</span>
        <span class="input-with-btn">
          <input data-field="cvss_score" value="{{ f.cvss_score }}" placeholder="0.0" inputmode="decimal">
          <button type="button" class="calc-btn" title="Калькулятор CVSS 3.1">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-5.97 4.06L14.09 6l1.41 1.41L16.91 6l1.06 1.06-1.41 1.41 1.41 1.41-1.06 1.06-1.41-1.4-1.41 1.41-1.06-1.06 1.41-1.41-1.41-1.42zM6.25 7.72h5v1.5h-5v-1.5zM11.5 16h-2v2H8v-2H6v-1.5h2v-2h1.5v2h2V16zm6.5 1.25h-5v-1.5h5v1.5zm0-2.5h-5v-1.5h5v1.5z"/></svg>
            Калькулятор
          </button>
        </span>
      </label>
      <label><span>{{ L.status_l }}</span>
        <select data-field="status">
          {% for k, v in L.status.items() %}<option value="{{ k }}" {% if f.status == k %}selected{% endif %}>{{ v }}</option>{% endfor %}
        </select>
      </label>
      {# CWE field hidden for now; the DB column `cwe` is kept so it can be brought back. #}
      <label class="span-full"><span>{{ L.vector }}</span>
        <input data-field="cvss_vector" value="{{ f.cvss_vector }}" placeholder="CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H" class="mono">
      </label>
      <label class="span-full"><span>{{ L.assets }}</span>
        <input data-field="assets" value="{{ f.assets }}" placeholder="https://host/path, 10.0.0.5:443">
      </label>
    </div>
    {% for key in ['description', 'impact', 'reproduction', 'recommendation', 'refs'] %}
    <h4 class="field-label">{{ L['f_' ~ key] }}</h4>
    <div class="rich" contenteditable="true" data-field="{{ key }}" data-placeholder="{{ L['f_' ~ key] }}…">{{ f[key]|safe }}</div>
    {% endfor %}
  </div>
</article>
